name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        run: |
          curl -sL --max-redirs 10 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://your-app-name.streamlit.app" > /dev/null
